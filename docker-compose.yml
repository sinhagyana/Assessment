services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             gunicorn doc_ai_api.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - media_data:/app/media
    restart: unless-stopped

volumes:
  media_data:
